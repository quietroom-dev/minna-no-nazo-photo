<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>みんなの謎写真館</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{

background:#f4f4f4;

font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
color:#333;

padding-bottom:90px;

}

header{

background:white;

padding:20px;

text-align:center;

font-size:30px;

font-weight:bold;

box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.catch{

padding:20px;

text-align:center;

line-height:1.8;

font-size:17px;

}

.menu{

padding:15px;

display:grid;

gap:12px;

}

.menu button{
    height:60px;
    border:none;
    border-radius:15px;
    background:#4F8DF7;
    color:white !important;
    font-size:18px;
    font-weight:bold;
}

.stampBtn{
border:none;
font-size:18px;
margin:6px;
cursor:pointer;
transition:.15s;
background: none;
}

.stampBtn:active{

transform:scale(.9);

background:#e8e8e8;

}
  
section{

padding:15px;

}

h2{

margin-bottom:10px;

}

.gallery{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:10px;

}

.photo{

background:white;

aspect-ratio:1;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

box-shadow:0 2px 6px rgba(0,0,0,.08);

transition:.2s;

}

.photo:active{

transform:scale(.95);

}

footer{

text-align:center;

padding:20px;

font-size:12px;

color:#999;

}

.dark{

background:#222;

color:white;

}

.dark header{

background:#333;

color:white;

}

.dark .photo{

background:#444;

}

</style>
<link rel="stylesheet" href="style.css">
</head>

<body>

    padding:8px 45px 8px 10px;

  "

     ">

type="file"

<textarea

</textarea>

<button
