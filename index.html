<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>みんなの謎写真館</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#f4f4f4;

font-family:-apple-system,BlinkMacSystemFont,sans-serif;

color:#333;

padding-bottom:90px;

}

header{

background:white;

padding:20px;

text-align:center;

font-size:30px;

font-weight:bold;

box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.catch{

padding:20px;

text-align:center;

line-height:1.8;

font-size:17px;

}

.menu{

padding:15px;

display:grid;

gap:12px;

}

.menu button{

height:60px;

border:none;

border-radius:15px;

background:#4F8DF7;

color:white;

font-size:18px;

font-weight:bold;

}

section{

padding:15px;

}

h2{

margin-bottom:10px;

}

.gallery{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:10px;

}

.photo{

background:white;

aspect-ratio:1;

border-radius:15px;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

box-shadow:0 2px 6px rgba(0,0,0,.08);

transition:.2s;

}

.photo:active{

transform:scale(.95);

}

nav{

position:fixed;

bottom:0;

left:0;

width:100%;

height:70px;

background:white;

display:grid;

grid-template-columns:repeat(4,1fr);

box-shadow:0 -2px 8px rgba(0,0,0,.1);

}

nav div{

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

}

footer{

text-align:center;

padding:20px;

font-size:12px;

color:#999;

}

.dark{

background:#222;

color:white;

}

.dark header{

background:#333;

color:white;

}

.dark .photo{

background:#444;

}

</style>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

📷<br>

みんなの謎写真館

</header>

<div class="catch">

SNSに載せるほどじゃない。<br>

どうして撮ったかも分からない。<br>

そんな謎の写真館。

</div>

<div class="menu">

<input
type="file"
id="photoInput"
accept="image/*"
style="display:none;">

<button id="uploadBtn">

📸 写真を投稿

</button>

<textarea
id="comment"
maxlength="50"
placeholder="コメント（任意・50文字まで）"
style="
width:100%;
height:70px;
border-radius:12px;
padding:10px;
font-size:16px;
resize:none;
">
</textarea>

<button id="fortuneBtn">
🎲 今日の謎写真占い
</button>

<button id="rankingBtn">
🏆 ランキング
</button>

</div>

<section>

<h2>🔥 今日の人気</h2>

<div class="gallery" id="popularGallery">

<div class="photo">📷</div>
<div class="photo">📷</div>
<div class="photo">📷</div>
<div class="photo">📷</div>

</div>

</section>

<section>

<h2>🆕 新着写真</h2>

<div class="gallery" id="photoGallery">

</div>

</section>

<footer>

©2026 みんなの謎写真館

</footer>

<nav>

<div>🏠</div>

<div>➕</div>

<div>🏆</div>

<div>🎲</div>
<div id="fortuneModal" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:999;
">

<div style="
background:white;
padding:20px;
border-radius:20px;
max-width:90%;
">

<h2 style="text-align:center;">
🎲 今日の謎写真占い
</h2>

<img
id="fortuneImage"
style="
width:100%;
border-radius:15px;
margin-top:15px;
">

<p
id="fortuneComment"
style="
margin-top:15px;
text-align:center;
">
</p>

<button
onclick="closeFortune()"
style="
width:100%;
margin-top:20px;
height:50px;
border:none;
border-radius:15px;
background:#4F8DF7;
color:white;
font-size:18px;
">
閉じる
</button>

</div>

</div>
</nav>

<script>
const CLOUD_NAME = "wgit6ga6";
const UPLOAD_PRESET = "minna_photo";
</script>

<script type="module" src="script.js"></script>

</body>
</html>
